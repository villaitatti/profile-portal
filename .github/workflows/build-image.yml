name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/villaitatti/profile-portal' }}

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version consistency
        # Runs for tags AND for main pushes: the release tag is validated against
        # the VERSION file, but the runtime version reported by
        # /api/health/ready comes from root package.json. Both must agree, or a
        # correctly-tagged release reports the wrong version in production.
        run: bash scripts/check-version-consistency.sh

      - name: Require successful CI for this commit
        # `Build image` and `CI` both trigger on pushes to main and run in
        # parallel, and `Deploy dev` deploys whatever `Build image` produces. So
        # without this gate a direct push or an admin merge with red CI would
        # auto-deploy to the dev VM (which also hosts CiviCRM). Tag builds are
        # gated by "Verify release tag provenance" below, which requires an
        # already-completed successful CI run, so this step only covers main.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            # `.conclusion // "pending"` maps queued/in-progress runs (null
            # conclusion) to "pending"; an empty list means CI has not been
            # created for this SHA yet.
            states=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
              --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')
            # Precedence matters: failures are checked BEFORE success. The old
            # success-first match let a mixed state like "failure success" (or
            # an early success with a second run still pending) pass the gate.
            # Any conclusion that is neither success nor pending fails
            # immediately; pending waits; success is accepted only when every
            # run for this SHA succeeded.
            bad=$(tr ' ' '\n' <<<"$states" | grep -vE '^(success|pending)$' | sort -u | xargs || true)
            if [[ -n "$bad" ]]; then
              echo "Refusing to build $GITHUB_SHA: CI concluded '$states' (blocking: '$bad')."
              echo "Fix CI on main before an image is published and auto-deployed to dev."
              exit 1
            elif [[ " $states " == *" pending "* ]]; then
              : # still running, keep waiting
            elif [[ -z "${states// /}" ]]; then
              : # no CI run registered yet, keep waiting
            else
              echo "CI succeeded for $GITHUB_SHA."
              break
            fi
            if [[ "$(date +%s)" -ge "$deadline" ]]; then
              echo "Timed out after 30m waiting for CI on $GITHUB_SHA (last state: '$states')."
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA (state: '$states')..."
            sleep 20
          done

      - name: Verify release tag provenance
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the exact vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          TAG_SHA=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          git fetch --force origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Refusing to build a release tag that is not on origin/main."
            exit 1
          fi

          expected_tag="v$(git show "$TAG_SHA:VERSION" | tr -d '\r\n[:space:]')"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)."
            exit 1
          fi

          successful_ci=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TAG_SHA&event=push&status=success&per_page=100" \
            --jq '.total_count')
          if [[ "$successful_ci" -lt 1 ]]; then
            echo "Refusing to build a release tag without a successful push run of CI."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
