name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify version consistency
        # VERSION gates the release tag, but packages/server/tsup.config.ts bakes
        # the ROOT package.json version into __APP_VERSION__ — which is what
        # /api/health/ready reports and what the DEPLOYMENT.md release gate asks
        # the operator to verify. Those two drifted silently once (VERSION
        # 0.17.14 vs package.json 0.17.13), so a correctly-tagged release would
        # have reported the wrong version in production. Fail the build instead.
        run: bash scripts/check-version-consistency.sh

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # The advisories endpoint (registry.npmjs.org/-/npm/v1/security/advisories/bulk)
        # occasionally times out; run 33838361764 failed on that timeout, not on a
        # finding, and pnpm's own three retries were not enough. Retry the whole
        # command a few times. A real vulnerability fails immediately: pnpm prints
        # "vulnerabilities found" only when the registry actually answered. If the
        # registry never answers, surface a warning annotation instead of blocking
        # every merge on npm's advisory service being reachable.
        run: |
          for attempt in 1 2 3; do
            set +e
            output=$(pnpm audit --prod --audit-level=moderate 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -qi 'vulnerabilities found'; then
              echo "::error::pnpm audit reported vulnerabilities at or above moderate severity."
              exit "$status"
            fi
            # Only a confirmed registry/network failure earns a retry. Anything
            # else (a pnpm crash, a lockfile problem, an unexpected exit) fails
            # here rather than being waved through as "registry unavailable".
            if ! printf '%s' "$output" | grep -qiE 'TimeoutError|aborted due to timeout|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|fetch failed|advisories/bulk .*(error|5[0-9][0-9])'; then
              echo "::error::pnpm audit failed for a reason other than registry availability (exit $status)."
              exit "$status"
            fi
            echo "Audit attempt $attempt could not reach the advisories registry; retrying in 30s."
            sleep 30
          done
          echo "::warning::pnpm audit skipped: the npm advisories registry was unreachable after 3 attempts."

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build email templates
        # MJML-compiled HTML is checked into the repo so production never
        # depends on mjml at runtime. Re-running the compile and failing on
        # any change catches BOTH (a) a developer who edited an .mjml source
        # without committing the refreshed .compiled.html, AND (b) a new
        # template whose .compiled.html was never added at all. `git status
        # --porcelain --untracked-files=all` covers both modifications and
        # untracked files; plain `git diff --exit-code` would miss case (b).
        run: |
          pnpm --filter @itatti/server build:email-templates
          STATUS=$(git status --porcelain --untracked-files=all -- packages/server/src/templates/emails/)
          if [ -n "$STATUS" ]; then
            echo "ERROR: compiled email templates are stale or missing. Run 'pnpm --filter @itatti/server build:email-templates' locally and commit the result."
            echo "$STATUS"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        # `-r` runs the test script in every workspace (server + web). Web
        # tests previously didn't gate merges; codex review 2026-04-23 flagged
        # this as a tight-feedback-loop gap. Fixed here.
        # Coverage is reported for visibility only — deliberately NOT a
        # threshold gate (a mandatory percentage incentivizes low-value tests).
        run: pnpm -r test:coverage

      - name: Production build
        run: pnpm build

  # Real-PostgreSQL gate: proves the full migration chain applies to an empty
  # database and runs the integration suite (constraints, atomic dispatch
  # claim, unique races) BEFORE anything can be deployed. The unit-test job
  # above cannot catch a migration that only fails against real Postgres.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migration check (empty database -> HEAD)
        run: pnpm --filter @itatti/server exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test

      - name: Integration tests
        run: pnpm --filter @itatti/server test:integration
