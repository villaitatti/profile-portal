name: Deploy dev

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example sha-<commit-sha>"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/villaitatti/profile-portal' }}

jobs:
  deploy:
    name: Deploy to dev VM
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on:
      group: itatti-it-deploy
      labels: [self-hosted, linux, x64, itatti-it-deploy]
    environment: dev
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      COMPOSE_PROJECT_NAME: profile-portal
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configure SSH
        # These runners are self-hosted, so $HOME persists across jobs and any
        # later workflow landing on the same runner could read a key left in
        # ~/.ssh. Keep the key in the per-job RUNNER_TEMP directory and delete it
        # in an `if: always()` step below.
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/ssh/profile_portal_deploy"
          chmod 600 "$RUNNER_TEMP/ssh/profile_portal_deploy"
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy image
        env:
          SSH_KEY_PATH: ${{ runner.temp }}/ssh/profile_portal_deploy
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh/known_hosts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-image.sh

      - name: Remove deploy SSH key
        if: always()
        run: |
          if command -v shred >/dev/null 2>&1; then
            shred -u "$RUNNER_TEMP/ssh/profile_portal_deploy" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/ssh"
          # Also clear the pre-hardening location in case an older run of this
          # workflow left a key behind on this runner.
          rm -f ~/.ssh/profile_portal_deploy
