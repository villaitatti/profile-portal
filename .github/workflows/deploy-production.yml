name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to deploy, for example v1.1.0"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/villaitatti/profile-portal' }}

jobs:
  deploy:
    name: Deploy selected version to production VM
    runs-on:
      group: itatti-it-deploy
      labels: [self-hosted, linux, x64, itatti-it-deploy]
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.version_tag }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      COMPOSE_PROJECT_NAME: profile-portal
      CREATE_BACKUP: "true"
      BACKUP_DIR: ${{ vars.BACKUP_DIR || '/opt/profile-portal/backups' }}
    steps:
      # Start from trusted main so a tag cannot supply the verification script.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_tag must use the exact vMAJOR.MINOR.PATCH format"
            exit 1
          fi

          git fetch --force origin "refs/tags/$IMAGE_TAG:refs/tags/$IMAGE_TAG" main
          TAG_SHA=$(git rev-parse "refs/tags/$IMAGE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Refusing to deploy a tag that is not on origin/main."
            exit 1
          fi

          expected_tag="v$(git show "$TAG_SHA:VERSION" | tr -d '\r\n[:space:]')"
          if [[ "$IMAGE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $IMAGE_TAG does not match VERSION ($expected_tag)."
            exit 1
          fi

          # The tag is validated against VERSION, but the version the running
          # container reports on /api/health/ready comes from root package.json
          # (baked in as __APP_VERSION__ by packages/server/tsup.config.ts). If
          # those disagree the release gate's "verify the version" step is
          # meaningless, so assert consistency at the exact commit being shipped.
          bash scripts/check-version-consistency.sh "$TAG_SHA"

          successful_ci=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TAG_SHA&event=push&status=success&per_page=100" \
            --jq '.total_count')
          if [[ "$successful_ci" -lt 1 ]]; then
            echo "Refusing to deploy a tag without a successful push run of CI."
            exit 1
          fi

          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          image_revision=$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [[ "$image_revision" != "$TAG_SHA" ]]; then
            echo "Image revision $image_revision does not match verified tag commit $TAG_SHA."
            exit 1
          fi
          image_ref=""
          while IFS= read -r digest; do
            if [[ "$digest" == "$IMAGE_NAME@sha256:"* ]]; then
              image_ref="$digest"
              break
            fi
          done < <(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" \
            --format '{{ range .RepoDigests }}{{ println . }}{{ end }}')
          if [[ -z "$image_ref" ]]; then
            echo "Could not resolve an immutable digest for $IMAGE_NAME:$IMAGE_TAG."
            exit 1
          fi

          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"

      - name: Configure SSH
        # Self-hosted runner: $HOME persists across jobs, so a production deploy
        # key written to ~/.ssh would be readable by any later workflow that
        # lands on this runner. Keep it in the per-job RUNNER_TEMP directory and
        # delete it in the `if: always()` step below.
        env:
          # Passed through env rather than interpolated into the script body:
          # ${{ secrets.X }} inside `run:` is substituted into the shell source
          # before execution, so a secret containing quotes or backticks would
          # be parsed as code. An env var is data no matter what it contains.
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/profile_portal_deploy"
          chmod 600 "$RUNNER_TEMP/ssh/profile_portal_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy image
        env:
          SSH_KEY_PATH: ${{ runner.temp }}/ssh/profile_portal_deploy
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh/known_hosts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-image.sh

      - name: Remove deploy SSH key
        if: always()
        run: |
          if command -v shred >/dev/null 2>&1; then
            shred -u "$RUNNER_TEMP/ssh/profile_portal_deploy" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/ssh"
          # Also clear the pre-hardening location in case an older run of this
          # workflow left a key behind on this runner.
          rm -f ~/.ssh/profile_portal_deploy
