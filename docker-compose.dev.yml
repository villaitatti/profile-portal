services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Loopback only — this is a dev database with a known password; never
      # publish it on all interfaces.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: profile_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
