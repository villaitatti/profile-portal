packages:
  - "packages/*"

overrides:
  "@babel/core": "7.29.6"
  defu: "6.1.5"
  effect: "3.20.0"
  "esbuild@0.27.4": "0.28.1"
  form-data: "4.0.6"
  js-yaml: "4.2.0"
  lodash: "4.18.1"
  # mysql2 reaches us only as a dependency of the Prisma CLI (`prisma` pins
  # 3.15.3). Our datasource is PostgreSQL, so the MySQL driver is never loaded —
  # but GHSA-3f6p-5ww8-9rcr (high) and GHSA-rgwj-5xj2-c3m3 (moderate) trip the
  # CI `pnpm audit --prod` gate. Same-major bump of an unexercised driver is
  # safer than a standing suppression. Drop once Prisma bumps its own pin.
  mysql2: "3.24.3"
  picomatch: "4.0.4"
  postcss: "8.5.10"
  qs: "6.16.0"
  "cheerio>undici": "6.27.0"
  "jsdom>undici": "7.28.0"
  "uuid@9.0.1": "11.1.1"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  browser-tabs-lock: true
  esbuild: true
  prisma: true
  sharp: true

auditConfig:
  ignoreGhsas:
    # GHSA-qwww-vcr4-c8h2 — "React Router: RSC Mode CSRF Bypass Allows Action
    # Execution Before 400 Response" (react-router >=7.12.0 <8.3.0).
    #
    # Not applicable here, and there is no 7.x fix — the advisory is only
    # patched in 8.3.0. The app now imports from the single react-router
    # package (react-router-dom was removed 2026-08), so clearing this is
    # just the v8 major bump.
    #
    # Why it cannot affect us: the vulnerability is in RSC mode, where a server
    # action runs before the CSRF check rejects the request. packages/web is a
    # pure client-side SPA — createBrowserRouter + RouterProvider, no RSC, no
    # SSR entry point, no route loaders or actions, no react-router/server
    # import, no createStaticHandler. The Express API is separately authenticated
    # with bearer tokens and no cookies, so there is no CSRF surface for an
    # action to bypass.
    #
    # Revisit when doing the react-router v8 migration; drop this entry then.
    - "GHSA-qwww-vcr4-c8h2"
    # GHSA-ggr8-5vv4-36mx — deepmerge-ts <8.0.0. A transitive dependency of the
    # Prisma CLI (@prisma/config → prisma / @prisma/client), which pins 7.1.5.
    #
    # Not in the server request path: deepmerge-ts runs only while the Prisma CLI
    # loads prisma.config during `prisma generate` / `prisma migrate deploy`, and
    # its only input is our own committed Prisma config, never user data.
    #
    # Not overridden to the patched 8.x on purpose: forcing a new MAJOR of a
    # Prisma-internal dependency risks breaking `prisma migrate deploy`, which
    # runs at container start — a deploy-time break is a worse outcome than a
    # suppressed advisory on a build-time-only dep with no untrusted input.
    # Drop this entry once Prisma bumps its own pin (tracked in TODOS.md).
    - "GHSA-ggr8-5vv4-36mx"
